<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota</title>
<meta name="theme-color" content="#FFF6E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rota">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* ===== Tema (paleta Recife: mar, sol, frevo) ===== */
:root{
  /* claro: areia + mar */
  --bg:#FFF6E5; --s1:#FFFFFF; --s2:#FFEBC9; --line:#F3DDB6;
  --tx:#14304A; --tx2:#667C90;
  --acc:#00A5B5; --acc-tx:#FFFFFF; --coral:#FF6B4A; --sun:#FFC400; --pink:#FF4FA3;
  --ok:#0DB36B; --warn:#F59E0B; --bad:#E5383B;
  --hero1:#00B7C7; --hero2:#2F7DFF;
  --nav-h:62px;
}
:root[data-theme="dark"]{
  /* escuro: mar à noite */
  --bg:#08202F; --s1:#0F3147; --s2:#16435E; --line:#1F5775;
  --tx:#F4FAFD; --tx2:#9DBAD0;
  --acc:#2DD9E8; --acc-tx:#052330; --coral:#FF8466; --sun:#FFD23F; --pink:#FF6DB4;
  --ok:#2BD58B; --warn:#FFB938; --bad:#FF6467;
  --hero1:#0796B0; --hero2:#2B5FE0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#08202F; --s1:#0F3147; --s2:#16435E; --line:#1F5775;
    --tx:#F4FAFD; --tx2:#9DBAD0;
    --acc:#2DD9E8; --acc-tx:#052330; --coral:#FF8466; --sun:#FFD23F; --pink:#FF6DB4;
    --ok:#2BD58B; --warn:#FFB938; --bad:#FF6467;
    --hero1:#0796B0; --hero2:#2B5FE0;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
h1,h2,h3{margin:0}
.hidden{display:none!important}

/* ===== Layout ===== */
#app{max-width:640px;margin:0 auto;min-height:100dvh}
.screen{padding:calc(env(safe-area-inset-top) + 16px) 16px 24px}
.main{padding:calc(env(safe-area-inset-top) + 14px) 14px calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px)}
.main::before,.screen::before{content:"";display:block;height:6px;margin:-14px -14px 14px;
  background:repeating-linear-gradient(90deg,var(--coral) 0 24px,var(--sun) 24px 48px,var(--acc) 48px 72px,var(--pink) 72px 96px)}
.top{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
.top h1{font-size:22px;font-weight:700}
.top small{color:var(--tx2)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--tx2)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.mt{margin-top:10px}

/* ===== Botões ===== */
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--s2);font-weight:600;min-height:44px}
.btn.pri{background:var(--acc);color:var(--acc-tx)}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{display:block;width:100%}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);z-index:20;
  background:var(--coral);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:700;
  box-shadow:0 6px 20px rgba(255,107,74,.45)}

/* ===== Navegação ===== */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--s1);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:640px;margin:0 auto;display:flex;height:var(--nav-h)}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--tx2);font-size:11px}
nav button .ic{font-size:21px;line-height:1}
nav button.on{color:var(--acc)}

/* ===== Chips / selos ===== */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);border-radius:999px;padding:7px 13px;font-size:14px}
.chip.on{background:var(--acc);color:var(--acc-tx);border-color:var(--acc)}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.b-ok{background:rgba(0,200,128,.16);color:var(--ok)}
.b-warn{background:rgba(245,183,0,.16);color:var(--warn)}
.b-bad{background:rgba(255,77,79,.16);color:var(--bad)}
.b-muted{background:var(--s2);color:var(--tx2)}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:10px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--s1);color:var(--tx)}

/* ===== Alertas ===== */
.alert{border-radius:14px;padding:12px 14px;margin-bottom:10px;border:1px solid;font-size:15px}
.alert.warn{background:rgba(245,183,0,.12);border-color:rgba(245,183,0,.5)}
.alert.bad{background:rgba(255,77,79,.12);border-color:rgba(255,77,79,.5)}
.alert.coral{background:rgba(255,122,89,.12);border-color:rgba(255,122,89,.5)}
.alert b{display:block}

/* ===== Painel ===== */
.hero{padding:18px;border-radius:22px;background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;margin-bottom:12px;box-shadow:0 8px 22px rgba(0,120,170,.25)}
.hero:has(.big.neg){background:linear-gradient(135deg,#FF7A59,#E5383B)}
.hero .muted,.hero .lbl{color:rgba(255,255,255,.88)}
.hero .lbl{font-size:13px;color:rgba(255,255,255,.9);text-transform:uppercase;letter-spacing:.05em}
.hero .big{font-size:40px;font-weight:800;margin:4px 0;letter-spacing:-.02em}
.hero .big.pos,.hero .big.neg{color:#fff}.big.pos{color:var(--ok)}.big.neg{color:var(--bad)}
.count{font-size:15px;color:var(--acc);font-weight:600;margin:0 2px 10px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s2);margin:8px 0 10px}
.bar i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:13px}
.legend b{display:block;font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.hbar{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin-top:4px}
.hbar i{display:block;height:100%;background:var(--acc)}

/* ===== Listas ===== */
.day{display:flex;justify-content:space-between;color:var(--tx2);font-size:13px;font-weight:600;margin:16px 4px 6px;text-transform:uppercase;letter-spacing:.03em}
.item{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:11px 13px;margin-bottom:8px;width:100%;text-align:left}
.item .ico{font-size:24px;width:34px;text-align:center}
.item .v{font-weight:700;font-variant-numeric:tabular-nums}
.item.prev{border-style:dashed;opacity:.85}
.res{border-left:5px solid var(--line);padding-left:12px}
.res.s-confirmada{border-left-color:var(--ok)}
.res.s-pendente{border-left-color:var(--warn)}
.res.s-problema{border-left-color:var(--bad)}
.res.s-cancelada{border-left-color:var(--tx2);opacity:.6}
.code{font:600 17px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;background:var(--s2);border-radius:10px;padding:8px 12px;display:inline-block;touch-action:manipulation}
.kv{font-size:14px;margin:4px 0}
.kv span{color:var(--tx2)}
.warnbox{background:rgba(255,77,79,.10);border:1px solid rgba(255,77,79,.4);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.infobox{background:rgba(245,183,0,.10);border:1px solid rgba(245,183,0,.4);border-radius:10px;padding:8px 10px;font-size:14px;margin:8px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.contact.susp{border-color:var(--bad);background:rgba(255,77,79,.07)}
.menu .item{font-size:17px}
.menu .item span.chev{margin-left:auto;color:var(--tx2)}

/* ===== Hoje ===== */
.daynav{display:flex;align-items:stretch;gap:8px;margin-bottom:12px}
.daynav button{background:var(--s1);border:1px solid var(--line);border-radius:14px;font-size:24px;width:52px;color:var(--tx)}
.daynav button:disabled{opacity:.3}
.daynav .mid{flex:1;font-size:16px;padding:8px;line-height:1.25}
.plan{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;margin-top:2px}
.plan:first-of-type{margin-top:8px}
.plan .hr{width:48px;color:var(--acc);font-weight:700}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:16px}
.xdel{background:none;border:0;color:var(--tx2);font-size:18px;width:40px;height:40px;border-radius:10px;flex:none}
.xdel:active{background:var(--s2);color:var(--bad)}
.chk-txt{background:none;border:0;text-align:left;padding:9px 0;font-size:16px;color:inherit}
.mt0{margin-top:3px}
.check input{width:22px;height:22px;accent-color:var(--acc)}

/* ===== Sheet / formulários ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--s1);
  border-radius:22px 22px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);max-height:92dvh;overflow-y:auto;
  border-top:1px solid var(--line)}
.sheet h2{font-size:18px;margin-bottom:12px}
label.f{display:block;margin-bottom:12px;font-size:13px;color:var(--tx2)}
label.f>input,label.f>select,label.f>textarea{display:block;width:100%;margin-top:4px;background:var(--s2);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;color:var(--tx);font-size:16px}
label.f>textarea{min-height:72px;resize:vertical}
input.big{width:100%;font-size:38px;font-weight:800;text-align:center;background:var(--s2);border:1px solid var(--line);
  border-radius:16px;padding:12px;color:var(--tx);margin-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.cats label,.pick label{position:relative}
.cats input,.pick input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;background:var(--s2);border:2px solid transparent;
  border-radius:14px;font-size:13px}
.cats span em{font-style:normal;font-size:28px}
.cats input:checked+span{border-color:var(--acc);background:rgba(25,195,214,.14)}
.pick{display:flex;gap:8px;margin-bottom:12px}
.pick label{flex:1}
.pick span{display:block;text-align:center;padding:12px 6px;background:var(--s2);border:2px solid transparent;border-radius:12px;font-weight:600}
.pick input:checked+span{border-color:var(--acc);background:rgba(25,195,214,.14)}
details{margin-bottom:12px} summary{color:var(--tx2);padding:6px 0;font-size:14px}
.err{color:var(--bad);font-size:14px;min-height:18px;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ===== Overlays ===== */
.overlay{position:fixed;inset:0;z-index:100;background:#7a0b0d;color:#fff;display:flex;flex-direction:column;justify-content:center;
  padding:28px;gap:14px}
.overlay h1{font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 70px);z-index:120;
  background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;max-width:90%}
.offline{background:var(--warn);color:#241a00;text-align:center;font-size:13px;font-weight:600;padding:5px 8px;
  padding-top:calc(env(safe-area-inset-top) + 5px)}
.logo{font-size:56px;margin-bottom:6px}
.splash{min-height:80dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.splash h1{font-size:34px;letter-spacing:-.02em;color:var(--acc)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="alert-root"></div>
<div id="toast-root"></div>

<!-- ============================================================
     1) LÓGICA PURA (sem Firebase, sem DOM) — testável via rotaTests()
     ============================================================ -->
<script id="puro">
'use strict';
const TZ = 'America/Recife';
const BLACKLIST_TELEFONES = [
  { numero: '556131420712', motivo: 'Falso atendimento Booking.com encontrado no Google' },
  { numero: '556135501608', motivo: 'Falso atendimento Booking.com encontrado no Google' },
  { numero: '551151183723', motivo: 'Falso atendimento Booking.com encontrado no Google' },
  { numero: '5531976011457', motivo: 'Falso atendimento Booking.com encontrado no Google' },
  { numero: '551151900965', motivo: 'Falso atendimento Booking.com encontrado no Google' },
  { numero: '551142807218', motivo: 'Falso atendimento Booking.com encontrado no Google' },
];
const CATEGORIAS = [
  ['comida', '🍽️', 'Comida'], ['transfer', '🚕', 'Transfer'], ['passeio', '⛵', 'Passeio'],
  ['mercado', '🛒', 'Mercado'], ['compras', '🛍️', 'Compras'], ['outro', '📦', 'Outro'],
];

/* ---- utilitários ---- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function brl(c) {
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format((c || 0) / 100);
}
/** "12,50" | "1.234,5" | "12.50" | "12" -> centavos (inteiro). Inválido -> NaN */
function parseMoney(str) {
  let s = String(str ?? '').replace(/R\$|\s/g, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  const [i, d = ''] = s.split('.');
  return parseInt(i, 10) * 100 + parseInt((d + '00').slice(0, 2), 10);
}
function centsToInput(c) {
  if (c == null) return '';
  return (c / 100).toFixed(2).replace('.', ',');
}

/* ---- datas ---- */
let _hojeOverride = null;
function setHojeOverride(s) { _hojeOverride = s || null; }
/** "YYYY-MM-DD" de hoje no fuso America/Recife (sobrescrevível em modo debug) */
function hoje() {
  if (_hojeOverride) return _hojeOverride;
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function agoraMs() {
  // em modo debug, "agora" = meio-dia do dia simulado
  return _hojeOverride ? Date.parse(_hojeOverride + 'T12:00:00-03:00') : Date.now();
}
function diasEntre(a, b) { // b - a, em dias, strings YYYY-MM-DD
  return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
}
function fmtDia(s) { // "2026-11-11" -> "11/11"
  return s ? s.slice(8, 10) + '/' + s.slice(5, 7) : '';
}
const SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function fmtDiaLongo(s) {
  const d = new Date(s + 'T12:00:00Z');
  return SEMANA[d.getUTCDay()] + ', ' + fmtDia(s);
}
function fmtDataHora(ms) {
  if (ms == null) return '';
  return new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(ms)).replace(',', '');
}
function msToLocalInput(ms) { // para <input type=datetime-local>
  if (ms == null) return '';
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    .formatToParts(new Date(ms)).map((x) => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function localInputToMs(s) {
  if (!s) return null;
  const t = Date.parse(s + ':00-03:00');
  return isNaN(t) ? null : t;
}

/* ---- cálculos do Painel (5.1 a 5.3) ---- */
function diasViagem(v) { return diasEntre(v.dataInicio, v.dataFim) + 1; }

function totais(reservas, gastos) {
  const comprometido = reservas.filter((r) => r.status !== 'cancelada').reduce((s, r) => s + (r.valorCentavos || 0), 0);
  const gasto = gastos.filter((g) => g.tipo === 'realizado').reduce((s, g) => s + (g.valorCentavos || 0), 0);
  const previsto = gastos.filter((g) => g.tipo === 'previsto').reduce((s, g) => s + (g.valorCentavos || 0), 0);
  return { comprometido, gasto, previsto };
}

function podeGastarHoje(v, reservas, gastos, hojeStr) {
  const orc = v.orcamentoCentavos || 0;
  const t = totais(reservas, gastos);
  const livre = orc - t.comprometido - t.gasto;
  const dias = diasViagem(v);
  if (hojeStr < v.dataInicio) {
    return { estado: 'antes', rotulo: 'Diária planejada', diaria: Math.round(livre / dias), livre, dias, ...t };
  }
  if (hojeStr > v.dataFim) {
    return { estado: 'depois', livre, dias, ...t };
  }
  const gastosAntes = gastos.filter((g) => g.tipo === 'realizado' && g.data < hojeStr).reduce((s, g) => s + g.valorCentavos, 0);
  const gastosHoje = gastos.filter((g) => g.tipo === 'realizado' && g.data === hojeStr).reduce((s, g) => s + g.valorCentavos, 0);
  const base = orc - t.comprometido - gastosAntes;
  const diasRestantes = diasEntre(hojeStr, v.dataFim) + 1;
  const limiteHoje = Math.round(base / diasRestantes);
  return {
    estado: 'durante', base, diasRestantes, limiteHoje, gastosHoje, restante: limiteHoje - gastosHoje,
    diaAtual: diasEntre(v.dataInicio, hojeStr) + 1, livre, dias, ...t,
  };
}

/** Quanto cada pessoa pagou ('ambos' = pago pelos dois meio a meio: não altera o acerto) (reservas pagas + gastos realizados) e o acerto entre dois membros. */
function pagoPorPessoa(reservas, gastos) {
  const m = {};
  for (const r of reservas) {
    if (r.status !== 'cancelada' && r.statusPagamento === 'pago' && r.pagoPor) m[r.pagoPor] = (m[r.pagoPor] || 0) + (r.valorCentavos || 0);
  }
  for (const g of gastos) {
    if (g.tipo === 'realizado' && g.pagoPor) m[g.pagoPor] = (m[g.pagoPor] || 0) + (g.valorCentavos || 0);
  }
  return m;
}
function acerto(reservas, gastos, emails) {
  if (!emails || emails.length !== 2) return null;
  const m = pagoPorPessoa(reservas, gastos);
  const [a, b] = emails;
  const pa = m[a] || 0, pb = m[b] || 0;
  const diff = Math.round(Math.abs(pa - pb) / 2);
  if (diff === 0) return { devedor: null, credor: null, valor: 0, pagos: m };
  return pa > pb ? { devedor: b, credor: a, valor: diff, pagos: m } : { devedor: a, credor: b, valor: diff, pagos: m };
}

/* ---- prazos / alertas (5.4) ---- */
function prazosProximos(reservas, agora, dias = 7) {
  return reservas
    .filter((r) => r.status !== 'cancelada' && r.prazoCritico && r.prazoCritico.quando != null)
    .map((r) => ({ reserva: r, quando: r.prazoCritico.quando, descricao: r.prazoCritico.descricao, dias: Math.ceil((r.prazoCritico.quando - agora) / 86400000) }))
    .filter((p) => p.quando >= agora && p.quando <= agora + dias * 86400000)
    .sort((x, y) => x.quando - y.quando);
}

/* ---- código mascarado ---- */
function mascarar(codigo) {
  const c = String(codigo || '');
  if (!c) return '—';
  if (c.length <= 4) return '•'.repeat(c.length);
  return c.slice(0, 2) + '•'.repeat(Math.min(c.length - 4, 8)) + c.slice(-2);
}

/* ---- telefones / antigolpe (5.5) ---- */
function normalizarTelefone(t) {
  let d = String(t || '').replace(/\D/g, '');
  d = d.replace(/^0+/, '');
  if (d.length === 10 || d.length === 11) d = '55' + d;
  return d;
}
function checarBlacklist(tel, extra) {
  const n = normalizarTelefone(tel);
  if (!n) return null;
  const lista = BLACKLIST_TELEFONES.concat((extra || []).map((e) => ({ numero: normalizarTelefone(e.numero), motivo: e.motivo || 'Número marcado como golpe' })));
  return lista.find((b) => b.numero === n) || null;
}

  } else if (pg.estado === 'depois') html += resumoFinal(v, pg);

  // pré-viagem (só antes da viagem começar): vem primeiro, é o que importa agora
  if (pg.estado === 'antes') html += cardPreViagem();

  // plano do dia
  const ev = eventosDoDia(dia), rot = achar(S.roteiro, dia) || {};
  const mare = (l, arr) => (arr && arr.length ? `${l} ${arr.map((m) => m.hora + (m.alturaM != null ? ` (${m.alturaM}m)` : '')).join(' · ')}` : '');
  const mares = [mare('🌊 Baixa', rot.mareBaixa), mare('Alta', rot.mareAlta)].filter(Boolean).join('  |  ');
  html += `<div class="card"><div class="row between"><h3 style="margin:0">Plano do dia</h3><div><button class="btn sm" data-act="novoBloco" data-v="${dia}">+ Item</button></div></div>
    ${mares ? `<div class="small mt">${esc(mares)}</div>` : ''}
    ${ev.length ? ev.map((e) => `<button class="plan" ${e.bloco != null ? `data-act="editBloco" data-v="${dia}" data-i="${e.bloco}"` : 'data-act="ir" data-tab="viagem" data-v="reservas"'}>
      <span class="hr num">${esc(e.hora)}</span><span class="grow"><span>${e.emoji}</span> ${esc(e.titulo)}${e.notas ? `<br><span class="muted small">${esc(e.notas)}</span>` : ''}</span></button>`).join('')
      : '<div class="muted small mt">Nada planejado. Toque em “+ Item”.</div>'}
    <div class="actions"><button class="btn sm ghost" data-act="mares" data-v="${dia}">🌊 Marés do dia</button></div></div>`;

  html += cardTarefasDoDia(dia);
  const aComprar = S.compras.filter((c) => !c.feito);
  if (aComprar.length) html += `<button class="item" data-act="ir" data-tab="viagem" data-v="compras"><span class="ico">🛒</span><span class="grow"><b>Lista de compras</b><br><span class="muted small">${aComprar.length} ${aComprar.length === 1 ? 'item' : 'itens'} a comprar</span></span><span class="muted">›</span></button>`;

  // gastos do dia
  html += `<div class="card"><div class="row between"><h3 style="margin:0">Gastos do dia</h3><b class="num">${brl(totDia)}</b></div>
    ${gDia.length ? gDia.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0)).map((g) => `<button class="item mt" data-act="editGasto" data-id="${esc(g.id)}"><span class="ico">${catInfo(g.categoria)[1]}</span>
      <span class="grow"><b>${esc(g.descricao || catInfo(g.categoria)[2])}</b><br><span class="muted small">${esc(nomeDe(g.pagoPor))}</span></span><span class="v">${brl(g.valorCentavos)}</span></button>`).join('')
      : '<div class="muted small mt">Nenhum gasto neste dia.</div>'}</div>`;

  // nota do dia
  const dd = achar(S.diario, 'dia-' + dia);
  html += `<div class="card"><div class="row between"><h3 style="margin:0">Como foi o dia?</h3><button class="btn sm" data-act="notaDia" data-v="${dia}">${dd ? 'Editar' : 'Escrever'}</button></div>
    ${dd && dd.texto ? `<div class="mt" style="white-space:pre-wrap">${esc(dd.texto)}</div>` : '<div class="muted small mt">Uma frase já vale.</div>'}
    ${dd && /^https?:\/\//.test(dd.linkAlbum || '') ? `<div class="mt"><a href="${esc(dd.linkAlbum)}" target="_blank" rel="noopener noreferrer">📷 Álbum de fotos</a></div>` : ''}</div>`;
  return html;
}
function cardOrcamento() {
  const v = viagem(), pg = podeGastarHoje(v, S.reservas, S.gastos, hoje()), orc = v.orcamentoCentavos || 0;
  const total = Math.max(orc, pg.comprometido + pg.gasto) || 1;
  const w = (x) => Math.max(0, (x / total) * 100).toFixed(2);
  return `<div class="card"><h3>Orçamento ${brl(orc)}</h3>
    <div class="bar"><i style="width:${w(pg.comprometido)}%;background:var(--acc)"></i><i style="width:${w(pg.gasto)}%;background:var(--coral)"></i><i style="width:${w(Math.max(pg.livre, 0))}%;background:var(--ok)"></i></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--acc)"></span>Reservado<b class="num">${brl(pg.comprometido)}</b></div>
      <div><span class="dot" style="background:var(--coral)"></span>Gasto<b class="num">${brl(pg.gasto)}</b></div>
      <div><span class="dot" style="background:var(--ok)"></span>Livre<b class="num" style="color:${pg.livre < 0 ? 'var(--bad)' : 'inherit'}">${brl(pg.livre)}</b></div></div>
    ${pg.previsto ? `<div class="muted small mt">Previsto (ainda não pago): ${brl(pg.previsto)}</div>` : ''}</div>`;
}
function resumoFinal(v, pg) {
  const orc = v.orcamentoCentavos || 0, total = pg.comprometido + pg.gasto, dif = orc - total;
  const porCat = {};
  S.gastos.filter((g) => g.tipo === 'realizado').forEach((g) => { porCat[g.categoria] = (porCat[g.categoria] || 0) + g.valorCentavos; });
  return `<div class="hero"><div class="lbl">Resumo final</div><div class="big num">${brl(total)}</div>
    <div class="small"><b>${dif >= 0 ? `${brl(dif)} abaixo do orçamento` : `${brl(-dif)} acima do orçamento`}</b></div>
    <div class="muted small mt">Reservas ${brl(pg.comprometido)} · gastos no destino ${brl(pg.gasto)}</div>
    <div class="mt">${Object.entries(porCat).sort((a, b) => b[1] - a[1]).map(([k, c]) => `<div class="small row between"><span>${catInfo(k)[1]} ${catInfo(k)[2]}</span><b class="num">${brl(c)}</b></div>`).join('')}</div></div>`;
}

/* ---------- Gastos ---------- */
function abaGastos() {
  const f = S.fGasto;
  let lista = S.gastos.filter((g) => g.tipo === f.tipo && (!f.cat || g.categoria === f.cat) && (!f.pessoa || g.pagoPor === f.pessoa));
  lista.sort((a, b) => b.data.localeCompare(a.data) || (b.criadoEm || 0) - (a.criadoEm || 0));
  const porDia = {};
  lista.forEach((g) => (porDia[g.data] = porDia[g.data] || []).push(g));
  const totalCat = {};
  lista.forEach((g) => { totalCat[g.categoria] = (totalCat[g.categoria] || 0) + g.valorCentavos; });
  const maxCat = Math.max(1, ...Object.values(totalCat));

  let html = `<div class="top"><h1>Gastos</h1></div>
    <div class="seg"><button class="${f.tipo === 'realizado' ? 'on' : ''}" data-act="fTipo" data-v="realizado">Realizados</button>
      <button class="${f.tipo === 'previsto' ? 'on' : ''}" data-act="fTipo" data-v="previsto">Previstos</button></div>
    <div class="chips"><button class="chip ${!f.cat ? 'on' : ''}" data-act="fCat" data-v="">Todas</button>
      ${CATEGORIAS.map(([k, i, l]) => `<button class="chip ${f.cat === k ? 'on' : ''}" data-act="fCat" data-v="${k}">${i} ${l}</button>`).join('')}</div>
    <div class="chips"><button class="chip ${!f.pessoa ? 'on' : ''}" data-act="fPessoa" data-v="">Todos</button>
      ${membros().concat(membros().length > 1 ? ['ambos'] : []).map((e) => `<button class="chip ${f.pessoa === e ? 'on' : ''}" data-act="fPessoa" data-v="${esc(e)}">${esc(nomeDe(e))}</button>`).join('')}</div>`;

  html = html.replace('<div class="seg">', cardOrcamento() + '<div class="seg">');
  if (Object.keys(totalCat).length) {
    html += `<div class="card"><h3>Por categoria</h3>${Object.entries(totalCat).sort((a, b) => b[1] - a[1]).map(([k, c]) =>
      `<div class="mt"><div class="row between small"><span>${catInfo(k)[1]} ${catInfo(k)[2]}</span><b class="num">${brl(c)}</b></div><div class="hbar"><i style="width:${(c / maxCat * 100).toFixed(1)}%"></i></div></div>`).join('')}</div>`;
  }

  if (!lista.length) html += `<div class="card center muted">Nenhum gasto ${f.tipo === 'previsto' ? 'previsto ' : ''}por aqui ainda.</div>`;
  for (const dia of Object.keys(porDia).sort().reverse()) {
    const tot = porDia[dia].reduce((s, g) => s + g.valorCentavos, 0);
    html += `<div class="day"><span>${fmtDiaLongo(dia)}</span><span class="num">${brl(tot)}</span></div>`;
    html += porDia[dia].map((g) => `<button class="item ${g.tipo === 'previsto' ? 'prev' : ''}" data-act="editGasto" data-id="${esc(g.id)}">
      <span class="ico">${catInfo(g.categoria)[1]}</span>
      <span class="grow"><b>${esc(g.descricao || catInfo(g.categoria)[2])}</b><br><span class="muted small">${esc(nomeDe(g.pagoPor))} · ${esc(formaNome(g.forma))}</span></span>
      <span class="v">${brl(g.valorCentavos)}</span></button>`).join('');
  }
  return html;
}

function salvarGasto(fd, id) {
  const valor = parseMoney(fd.get('valor'));
  if (!(valor > 0)) return 'Informe um valor maior que zero.';
  if (!fd.get('categoria')) return 'Escolha uma categoria.';
  const pagoPor = fd.get('pagoPor') || meuEmail();
  const dados = {
    valorCentavos: valor, categoria: fd.get('categoria'), descricao: String(fd.get('descricao') || '').trim(),
    pagoPor, forma: fd.get('forma') || 'pix', tipo: fd.get('tipo') || 'realizado', data: fd.get('data') || hoje(),
  };
  const ref = dRef('gastos', id);
  if (!id) { dados.criadoPor = meuEmail(); dados.criadoEm = serverTimestamp(); }
  setDoc(ref, dados, { merge: true }).catch(fail); // sem await: offline a promessa só resolve ao sincronizar
  const v = viagem(), fora = v && (dados.data < v.dataInicio || dados.data > v.dataFim);
  toast(`Gasto salvo: ${brl(valor)} em ${fmtDia(dados.data)}${fora ? ' (fora dos dias da viagem — veja na aba Gastos)' : ''}`);
  return null;
}

function salvarReserva(fd, id) {

  if (Number.isNaN(valor)) return 'Valor inválido.';
  const pq = localInputToMs(fd.get('prazoQuando'));
  const dados = {
    tipo: fd.get('tipo'), titulo, fornecedor: String(fd.get('fornecedor') || '').trim(), status: fd.get('status'),
    valorCentavos: valor, statusPagamento: fd.get('statusPagamento'), pagoPor: fd.get('pagoPor') || null,
    inicio: toTs(localInputToMs(fd.get('inicio'))), fim: toTs(localInputToMs(fd.get('fim'))),
    detalhes: String(fd.get('detalhes') || '').trim(),
    prazoCritico: pq != null ? { quando: toTs(pq), descricao: String(fd.get('prazoDesc') || '').trim() } : null,
    linkOficial: String(fd.get('linkOficial') || '').trim(), canalAtendimento: String(fd.get('canalAtendimento') || '').trim(),
    codigo: String(fd.get('codigo') || '').trim(), notas: String(fd.get('notas') || '').trim(),
  };
  if (!id) dados.ordem = S.reservas.length + 1;
  setDoc(dRef('reservas', id), dados, { merge: true }).catch(fail);
  return null;
}

function formMares(dia) {
  const d = achar(S.roteiro, dia) || {};
  return `<form data-form="mares" data-id="${esc(dia)}" autocomplete="off"><h2>Marés · ${fmtDiaLongo(dia)}</h2>
    <p class="muted small">Horários separados por vírgula, altura opcional. Ex.: 06:10 0.3, 18:30 0.4</p>
    <label class="f">Maré baixa<input name="baixa" value="${esc(marestxt(d.mareBaixa))}"></label>
    <label class="f">Maré alta<input name="alta" value="${esc(marestxt(d.mareAlta))}"></label>
    <div class="err" id="f-err"></div><button class="btn pri block" type="submit">Salvar</button></form>`;
}
function salvarMares(fd, dia) {
  const b = parseMares(fd.get('baixa')), a = parseMares(fd.get('alta'));
  if (!b || !a) return 'Formato inválido. Use HH:MM e, se quiser, a altura (ex.: 06:10 0.3).';
  setDoc(dRef('roteiro', dia), { mareBaixa: b, mareAlta: a }, { merge: true }).catch(fail);
  return null;
}
function formCheck(c, pre) {
  pre = pre || {};
  const tipo = c ? tipoCheck(c) : (pre.tipo || 'tarefa');
  const x = c || { texto: '', dono: pre.dono, dia: pre.dia, categoria: pre.cat };
  const donos = donosMala();
  const dono = x.dono || (tipo === 'mala' ? meuEmail() : 'ambos');
  const optDonos = donos.map((e) => `<option value="${esc(e)}" ${dono === e ? 'selected' : ''}>${esc(e === 'ambos' ? 'Os dois' : nomeDe(e))}</option>`).join('');
  const extra = tipo === 'mala'
    ? `<label class="f">Categoria<select name="categoria">${CATS_MALA.map(([k, e, n]) => `<option value="${k}" ${(x.categoria || 'outros') === k ? 'selected' : ''}>${e} ${n}</option>`).join('')}</select></label>`
    : `<label class="f">Dia<input type="date" name="dia" value="${esc(x.dia || x.prazo || diaAtivo(viagem()))}" required></label>`;
  return `<form data-form="check" data-id="${esc((c && c.id) || '')}" autocomplete="off"><input type="hidden" name="tipo" value="${tipo}">
    <h2>${c ? 'Editar' : 'Novo'} ${tipo === 'mala' ? 'item de mala' : 'tarefa'}</h2>
    <label class="f">${tipo === 'mala' ? 'Item' : 'O que fazer'}<input name="texto" required id="f-texto" value="${esc(x.texto)}"></label>
    <div class="grid2"><label class="f">${tipo === 'mala' ? 'Mala de' : 'Quem faz'}<select name="dono">${optDonos}</select></label>${extra}</div>
    <div class="err" id="f-err"></div><button class="btn pri block" type="submit">Salvar</button>
    ${c ? `<button class="btn bad block mt" type="button" data-act="delCheck" data-id="${esc(c.id)}">Excluir</button>` : ''}</form>`;
}
function salvarCheck(fd, id) {
  const texto = String(fd.get('texto')).trim();
  if (!texto) return 'Escreva o item.';
  const mala = fd.get('tipo') === 'mala';
  const dados = { texto, grupo: mala ? 'mala' : 'tarefa', dono: fd.get('dono') || 'ambos' };
  if (mala) dados.categoria = fd.get('categoria') || 'outros'; else dados.dia = fd.get('dia');
  if (!id) Object.assign(dados, { feito: false, feitoPor: null });
  setDoc(dRef('checklist', id), dados, { merge: true }).catch(fail);
  return null;
}
function formNota(dia) {
  const d = achar(S.diario, 'dia-' + dia) || {};
  return `<form data-form="nota" data-id="${esc(dia)}"><h2>Como foi o dia? · ${fmtDiaLongo(dia)}</h2>
    <label class="f"><textarea name="texto" style="min-height:120px" id="f-texto">${esc(d.texto || '')}</textarea></label>
    <label class="f">Link do álbum de fotos (opcional)<input name="link" type="url" value="${esc(d.linkAlbum || '')}"></label>
    <div class="err" id="f-err"></div><button class="btn pri block" type="submit">Salvar</button></form>`;
}
function salvarNota(fd, dia) {
  const v = viagem();
  const dados = { data: dia, titulo: 'Dia ' + (diasEntre(v.dataInicio, dia) + 1), texto: String(fd.get('texto') || '').trim(), linkAlbum: String(fd.get('link') || '').trim(), ordem: diasEntre(v.dataInicio, dia) + 1 };
  const ex = achar(S.diario, 'dia-' + dia);
  if (!ex) dados.criadoPor = meuEmail();
  setDoc(dRef('diario', 'dia-' + dia), dados, { merge: true }).catch(fail);
  return null;
}
const LISTA_PESSOAL = {
  roupas: ['Camisetas/regatas (5)', 'Bermudas/shorts (3)', 'Roupa de banho (2)', 'Roupa leve para a noite', 'Roupa de treino', 'Casaquinho leve (vento à noite)', 'Roupa íntima', 'Meias', 'Roupa de dormir'],
  calcados: ['Chinelo', 'Sapatilha para recifes', 'Tênis leve', 'Óculos de sol', 'Chapéu/boné'],
  higiene: ['Escova e pasta de dente', 'Desodorante', 'Shampoo e condicionador', 'Hidratante pós-sol', 'Protetor labial com FPS', 'Itens de cabelo e barba'],
  saude: ['Remédios de uso pessoal', 'Analgésico', 'Antialérgico', 'Curativos'],
  eletronicos: ['Carregador do celular', 'Fone de ouvido', 'Cabo extra'],
  documentos: ['RG ou CNH', 'Cartões de débito e crédito', 'Dinheiro em espécie', 'Cartões de embarque salvos offline'],
};
const LISTA_DOS_DOIS = {
  praia: ['Protetor solar FPS alto', 'Repelente', 'Toalhas de praia', 'Capa estanque para celular', 'Bolsa impermeável', 'Garrafa térmica'],
  eletronicos: ['Carregador do MacBook', 'Powerbank', 'Extensão/benjamim'],
  trabalho: ['MacBook', 'Fone com microfone para reuniões'],
  outros: ['Sacolas plásticas', 'Sacola para roupa suja', 'Kit básico de remédios'],
};
function sugestoesPre() {
  const out = [];
  for (const e of membros()) for (const [categoria, l] of Object.entries(LISTA_PESSOAL)) l.forEach((texto) => out.push({ texto, grupo: 'mala', dono: e, categoria }));
  for (const [categoria, l] of Object.entries(LISTA_DOS_DOIS)) l.forEach((texto) => out.push({ texto, grupo: 'mala', dono: 'ambos', categoria }));
  return out;
}
const norm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function checkSugestoes() {
  const chave = (c) => donoCheck(c) + '|' + norm(c.texto);
  const tem = new Map(S.checklist.filter((c) => tipoCheck(c) === 'mala').map((c) => [chave(c), c]));
  const b = writeBatch(db);
  let novos = 0, ajustados = 0;
  for (const c of sugestoesPre()) {
    const ex = tem.get(chave(c));
    if (!ex) { b.set(dRef('checklist'), { ...c, feito: false, feitoPor: null }); novos++; }
    else if (!ex.categoria) { b.set(dRef('checklist', ex.id), { categoria: c.categoria }, { merge: true }); ajustados++; }
  }
  if (!novos && !ajustados) return toast('Todas as sugestões já estão nas malas.');
  b.commit().catch(fail);
  toast(`${novos} itens adicionados${ajustados ? `, ${ajustados} arrumados` : ''}`);
}

/* ============================================================
   Sheet, ações e eventos
   ============================================================ */
function openSheet(html) {
  $('sheet-root').innerHTML = `<div class="sheet-bg" data-act="fechar"></div><div class="sheet">${html}</div>`;
}
function closeSheet() { $('sheet-root').innerHTML = ''; }
function inputPrompt(titulo, campos, onOk) {
  openSheet(`<form data-form="prompt"><h2>${esc(titulo)}</h2>${campos.map(([n, l, t]) => `<label class="f">${esc(l)}<input name="${n}" type="${t || 'text'}" required></label>`).join('')}
    <div class="err" id="f-err"></div><button class="btn pri block" type="submit">OK</button></form>`);
  window.__prompt = onOk;
}
const achar = (lista, id) => lista.find((x) => x.id === id);

const ACT = {
  entrar, sair,
  ir: (d) => { S.tab = d.tab; S.sub = d.v || null; render(); window.scrollTo(0, 0); },
  diaMov: (d) => { const v = viagem(); const x = new Date(diaAtivo(v) + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + Number(d.v)); S.dia = x.toISOString().slice(0, 10); render(); },
  diaHoje: () => { S.dia = null; render(); },
  novoBloco: (d) => openSheet(formBloco(d.v)),
  editBloco: (d) => openSheet(formBloco(d.v, Number(d.i))),
  delBloco: (d) => { const x = achar(S.roteiro, d.v); if (x && confirm('Excluir este item?')) { setDoc(dRef('roteiro', d.v), { blocos: x.blocos.filter((_, i) => i !== Number(d.i)) }, { merge: true }).catch(fail); closeSheet(); } },
  mares: (d) => openSheet(formMares(d.v)),
  malaSel: (d) => { S.malaSel = d.v; render(); },
  irMala: (d) => { S.malaSel = d.v; S.tab = 'viagem'; S.sub = 'checklist'; render(); window.scrollTo(0, 0); },
  novoCheck: (d) => { openSheet(formCheck(null, { tipo: d.tipo, dono: d.dono, dia: d.dia })); setTimeout(() => { const i = $('f-texto'); if (i) i.focus(); }, 60); },
  toggleCheck: (d) => { const c = achar(S.checklist, d.id); if (c) setDoc(dRef('checklist', d.id), { feito: !c.feito, feitoPor: c.feito ? null : meuEmail(), feitoEm: c.feito ? null : serverTimestamp() }, { merge: true }).catch(fail); },
  novaCompra: () => { openSheet(formCompra()); setTimeout(() => { const i = $('f-texto'); if (i) i.focus(); }, 60); },
  editCompra: (d) => openSheet(formCompra(achar(S.compras, d.id))),
  delCompra: (d) => { if (confirm('Excluir este item?')) { deleteDoc(dRef('compras', d.id)).catch(fail); closeSheet(); } },
  xCompra: (d) => deleteDoc(dRef('compras', d.id)).catch(fail),
  toggleCompra: (d) => { const c = achar(S.compras, d.id); if (c) setDoc(dRef('compras', d.id), { feito: !c.feito, feitoPor: c.feito ? null : meuEmail() }, { merge: true }).catch(fail); },
  xCheck: (d) => deleteDoc(dRef('checklist', d.id)).catch(fail), // sem confirmação: é fácil adicionar de novo
  editCheck: (d) => openSheet(formCheck(achar(S.checklist, d.id))),
  delCheck: (d) => { if (confirm('Excluir este item?')) { deleteDoc(dRef('checklist', d.id)).catch(fail); closeSheet(); } },
  checkSugestoes,
  notaDia: (d) => { openSheet(formNota(d.v)); setTimeout(() => { const i = $('f-texto'); if (i) i.focus(); }, 60); },
  copiarDiario: () => copiarTexto(diarioMd(), 'Diário copiado'),
  fechar: closeSheet,
  tab: (d) => { S.tab = d.tab; S.sub = null; render(); window.scrollTo(0, 0); },
  sub: (d) => { S.sub = d.v || null; render(); window.scrollTo(0, 0); },
  abrirViagem: (d) => abrirViagem(d.id),
  trocarViagem: () => { unsubSub.forEach((f) => f()); unsubSub = []; S.viagemId = null; render(); },
  seed: criarViagemExemplo,
  novaViagem: () => openSheet(formViagem()),
  editViagem: () => openSheet(formViagem(viagem())),
  novoGasto: () => { openSheet(formGasto()); setTimeout(() => { const i = $('f-valor'); if (i) i.focus(); }, 60); },
  editGasto: (d) => openSheet(formGasto(achar(S.gastos, d.id))),
  delGasto: (d) => { if (confirm('Excluir este gasto?')) { deleteDoc(dRef('gastos', d.id)).catch(fail); closeSheet(); } },
  fTipo: (d) => { S.fGasto.tipo = d.v; render(); },
  fCat: (d) => { S.fGasto.cat = d.v; render(); },
  fPessoa: (d) => { S.fGasto.pessoa = d.v; render(); },
  novaReserva: () => openSheet(formReserva()),
  editReserva: (d) => openSheet(formReserva(achar(S.reservas, d.id))),
  delReserva: (d) => { if (confirm('Excluir esta reserva?')) { deleteDoc(dRef('reservas', d.id)).catch(fail); closeSheet(); } },
  copiar: (d) => { const r = achar(S.reservas, d.id); copiarTexto(r && r.codigo, 'Código copiado'); },
  canal: (d) => { const r = achar(S.reservas, d.id); openSheet(`<h2>Atendimento — ${esc(r.titulo)}</h2><p>${esc(r.canalAtendimento)}</p><button class="btn block" data-act="fechar">Fechar</button>`); },
  novoContato: () => openSheet(formContato()),
  editContato: (d) => openSheet(formContato(achar(S.contatos, d.id))),
  delContato: (d) => { if (confirm('Excluir este contato?')) { deleteDoc(dRef('contatos', d.id)).catch(fail); closeSheet(); } },
  ligar: (d) => {
    const c = achar(S.contatos, d.id);
    const susp = selos(c) === 'suspeito';
    if (susp && !confirm('⚠️ Este contato está marcado como SUSPEITO (possível golpe). Ligar mesmo assim?')) return;
    location.href = 'tel:+' + normalizarTelefone(c.telefone);
  },
  zapSusp: () => {},
  copiarTel: (d) => { const c = achar(S.contatos, d.id); copiarTexto(c && c.telefone, 'Telefone copiado'); },
  alertaCancelar: () => { $('alert-root').innerHTML = ''; },
  alertaSalvar: () => window.__alertaSalvar && window.__alertaSalvar(),
  tema: (d) => { lsSet('rota-tema', d.v); aplicarTema(); render(); },
  addMembro: () => inputPrompt('Adicionar membro', [['email', 'E-mail (Google)', 'email'], ['nome', 'Nome']], (fd) => {
    const email = String(fd.get('email')).trim().toLowerCase(), nome = String(fd.get('nome')).trim();
    const v = viagem();
    if ((v.membrosEmails || []).includes(email)) return 'Esse e-mail já é membro.';
    patchViagem({ membrosEmails: [...(v.membrosEmails || []), email], membrosNomes: { [email]: nome } });
    return null;
  }),
  renMembro: (d) => { inputPrompt('Nome de ' + d.v, [['nome', 'Nome']], (fd) => { const nome = String(fd.get('nome')).trim(); if (!nome) return 'Informe o nome.'; patchViagem({ membrosNomes: { [d.v]: nome } }); return null; }); },
  rmMembro: (d) => { if (confirm('Remover ' + d.v + ' da viagem?')) patchViagem({ membrosEmails: viagem().membrosEmails.filter((e) => e !== d.v) }); },
  addBlack: () => inputPrompt('Número de golpe', [['numero', 'Telefone', 'tel'], ['motivo', 'Motivo']], (fd) => {
    const n = normalizarTelefone(fd.get('numero'));
    if (n.length < 10) return 'Telefone inválido.';
    patchViagem({ blacklistExtra: [...(viagem().blacklistExtra || []), { numero: n, motivo: String(fd.get('motivo')).trim() }] });
    return null;
  }),
  rmBlack: (d) => patchViagem({ blacklistExtra: (viagem().blacklistExtra || []).filter((_, i) => i !== Number(d.v)) }),
};
function copiarTexto(txt, msg) {
  if (!txt) return;
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast(msg); } catch (_) { toast('Não foi possível copiar'); }
    ta.remove();
  });
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && el.dataset.act === 'zapSusp' && !confirm('⚠️ Contato SUSPEITO (possível golpe). Abrir WhatsApp mesmo assim?')) e.preventDefault();
  else if (el.tagName !== 'A' && el.type !== 'checkbox') e.preventDefault();
  fn(el.dataset);
});

document.addEventListener('submit', (e) => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd = new FormData(form), id = form.dataset.id || '';
  let erro = null;
  try {
    switch (form.dataset.form) {
      case 'gasto': erro = salvarGasto(fd, id); break;
      case 'reserva': erro = salvarReserva(fd, id); break;
      case 'contato': erro = salvarContato(fd, id); break;
      case 'viagem': erro = salvarViagem(fd, id); break;
      case 'bloco': erro = salvarBloco(fd, id, form.dataset.i); break;
      case 'mares': erro = salvarMares(fd, id); break;
      case 'check': erro = salvarCheck(fd, id); break;
      case 'compra': erro = salvarCompra(fd, id); break;
      case 'nota': erro = salvarNota(fd, id); break;
      case 'prompt': erro = window.__prompt(fd); break;
    }
  } catch (x) { erro = x.message; }
  if (erro === 'pendente') return; // aguardando confirmação do alerta antigolpe
  if (erro) { const el = $('f-err'); if (el) el.textContent = erro; return; }
  if (form.dataset.form === 'compra' && !id) { // adicionar vários seguidos
    form.reset(); const i = $('f-texto'); if (i) i.focus(); toast('Adicionado ✓'); return;
  }
  closeSheet();
});

/* Toque longo no código da reserva: revela por 10 s */
let pressTimer = null;
function startPress(e) {
  const el = e.target.closest('[data-reveal]');
  if (!el) return;
  const id = el.dataset.reveal;
  pressTimer = setTimeout(() => {
    S.revelados[id] = Date.now() + 10000; render();
    setTimeout(render, 10100);
  }, 500);
}
const endPress = () => { clearTimeout(pressTimer); pressTimer = null; };
document.addEventListener('pointerdown', startPress);
['pointerup', 'pointercancel', 'pointerleave', 'scroll'].forEach((ev) => document.addEventListener(ev, endPress, true));
document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-reveal]')) e.preventDefault(); });

window.addEventListener('online', () => { S.online = true; render(); });
window.addEventListener('offline', () => { S.online = false; render(); });

/* ---------- Boot ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
if (!CONFIGURADO) { S.auth = 'semconfig'; render(); } else { render(); iniciarFirebase(); }
</script>
